<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Budget | Finora</title>
<link rel="shortcut icon" href="../assets/favicon.png.png" type="image/x-icon">

<link
rel="stylesheet"
href="../css/global.css">

<link
rel="stylesheet"
href="../css/budget.css">

<link
rel="stylesheet"
href="../css/toast.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <a href="./dashboard.html" class="back-btn">  
        
    

    <i class="fa-solid fa-arrow-left"></i>

    Back

</a>

<div class="budget-container">

<div class="budget-card">

<h1>

<i class="fa-solid fa-wallet"></i>

Category Budgets

</h1>

<p>

Set a monthly spending limit for each category.

</p>

<form id="budgetForm">

<div class="budget-grid">

<div class="input-group">

<label>

🍔 Food

</label>

<input
type="number"
id="Food"
placeholder="₦0">

</div>

<div class="input-group">

<label>

🚌 Transport

</label>

<input
type="number"
id="Transport"
placeholder="₦0">

</div>

<div class="input-group">

<label>

🛍 Shopping

</label>

<input
type="number"
id="Shopping"
placeholder="₦0">

</div>

<div class="input-group">

<label>

💡 Bills

</label>

<input
type="number"
id="Bills"
placeholder="₦0">

</div>

<div class="input-group">

<label>

🎬 Entertainment

</label>

<input
type="number"
id="Entertainment"
placeholder="₦0">

</div>

<div class="input-group">

<label>

🏥 Health

</label>

<input
type="number"
id="Health"
placeholder="₦0">

</div>

<div class="input-group">

<label>

📚 Education

</label>

<input
type="number"
id="Education"
placeholder="₦0">

</div>

<div class="input-group">

<label>

📦 Other

</label>

<input
type="number"
id="Other"
placeholder="₦0">

</div>

</div>

<button
type="submit"
class="submit-btn">

Save Budgets

</button>

</form>

</div>

<!-- ========================= -->
<!-- Budget Overview -->
<!-- ========================= -->

<div class="overview-section">

<h2>

Budget Overview

</h2>

<div
id="budgetOverview"
class="overview-grid">

<!-- Generated by budget.js -->

</div>

</div>

</div>

<!-- ========================= -->
<!-- Toast -->
<!-- ========================= -->

<div id="toast" class="toast success">

<div class="toast-icon">

<i
id="toastIcon"
class="fa-solid fa-circle-check">

</i>

</div>

<div class="toast-content">

<h4 id="toastTitle">

Success

</h4>

<p id="toastMessage">

Message

</p>

</div>

<button
id="toastClose"
class="toast-close"
type="button">

<i class="fa-solid fa-xmark"></i>

</button>

<div
id="toastProgress"
class="toast-progress">

</div>

</div>

<script
type="module"
src="../js/budget.js">

</script>

</body>

</html>
