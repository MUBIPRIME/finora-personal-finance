<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Finora</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png.png">

    <link rel="stylesheet"
        href="../css/global.css">

    <link rel="stylesheet"
        href="../css/dashboard.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

<div class="dashboard">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

          <img src="../assets/favicon.png.png" alt="Finora logo" class="favicon">

          <span>Finora</span>

        </div>

        <nav>

            <a href="dashboard.html" class="active">

                <i class="fa-solid fa-house"></i>

                Dashboard

            </a>

            <a href="income.html">

                <i class="fa-solid fa-wallet"></i>

                Income

            </a>

            <a href="expense.html">

                <i class="fa-solid fa-credit-card"></i>

                Expenses

            </a>

            <a href="budget.html">

                <i class="fa-solid fa-bullseye"></i>

                Budget

            </a>

            <a href="report.html">

                <i class="fa-solid fa-chart-line"></i>

                Reports

            </a>

            <a href="settings.html">

                <i class="fa-solid fa-gear"></i>

                Settings

            </a>

        </nav>

    </aside>

    <!-- Main -->

    <main class="content">

    <header class="topbar">

    <div class="topbar-left">

        <button id="menuToggle" class="menu-toggle">

            <i class="fa-solid fa-bars"></i>

        </button>

        <div>

            <h1>Welcome Back 👋</h1>

            <p id="username">Loading...</p>

        </div>

    </div>

    <div class="profile">

        <i class="fa-solid fa-bell"></i>

        <img
            src="https://ui-avatars.com/api/?name=User&background=2563eb&color=fff"
            alt="Profile">

    </div>

</header>

        <!-- Cards -->

        <section class="cards">

            <div class="card balance">

                <h3>Total Balance</h3>

                <h2 id="balance">

                    ₦0.00

                </h2>

            </div>

            <div class="card">

                <h3>Total Income</h3>

                <h2 id="income">

                    ₦0.00

                </h2>

            </div>

            <div class="card">

                <h3>Total Expenses</h3>

                <h2 id="expense">

                    ₦0.00

                </h2>

            </div>

            <div class="card">

                <h3>Savings</h3>

                <h2 id="savings">

                    ₦0.00

                </h2>

            </div>

        </section>

        <!-- Quick Actions -->

        <section class="actions">

            <a href="income.html">

                ➕ Add Income

            </a>

            <a href="expense.html">

                ➖ Add Expense

            </a>

            <a href="budget.html">

                🎯 Budget

            </a>

            <a href="report.html">

                📊 Reports

            </a>

        </section>

        <!-- Transactions -->

        <section class="transactions">

            <h2>

                Recent Transactions

            </h2>

            <div id="transactionList">

                No transactions yet.

            </div>

        </section>

    </main>

</div>

<script
type="module"
src="../js/dashboard.js">

</script>

</body>

</html>
