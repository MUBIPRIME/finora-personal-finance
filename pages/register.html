<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Account | Finora</title>
<link rel="shortcut icon" href="../assets/favicon.png.png" type="image/x-icon">

<link rel="stylesheet"
href="../css/global.css">

<link rel="stylesheet"
href="../css/register.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="register-page">

<div class="register-left">

<div class="overlay">

<h1>Welcome To Finora</h1>

<p>

Take control of your finances with
beautiful insights and powerful tools.

</p>

</div>

</div>

<div class="register-right">

<div class="register-card">

<h2>Create Account</h2>

<p>

Start managing your money smarter.

</p>

<form id="registerForm">

<input
type="text"
id="fullName"
placeholder="Full Name"
class="input"
required>

<input
type="email"
id="email"
placeholder="Email Address"
class="input"
required>

<div class="password-group">

    <input
        type="password"
        id="password"
        class="input"
        placeholder="Password"
        required
    >

     <button
        type="button"
        id="togglePassword"
        class="password-toggle"
    >
      <i class="fa-solid fa-eye"></i>
    </button>

 
</div>

<div class="password-group">

    <input
        type="password"
        id="confirmPassword"
        class="input"
        placeholder="Confirm Password"
        required
    >

    <button
        type="button"
        id="toggleConfirmPassword"
        class="password-toggle"
    >
        <i class="fa-solid fa-eye"></i>
    </button>

</div>
<div class="strength">

    <div class="strength-bar">

        <div id="strengthFill"></div>

    </div>

    <small id="strengthText">

        Password Strength

    </small>

</div>
<label class="terms">

    <input
        type="checkbox"
        id="terms"
    >

    I agree to the
    <a href="/pages/terms.html">Terms & Conditions</a>

</label>

<button
    type="submit"
    class="btn btn-primary submit-btn"
    id="registerBtn"
>

    Create Account

</button>

<p class="login-text">

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

</div>

</div>

<div class="toast" id="toast"></div>

<script type="module" src="../js/register.js"></script>

</div>

</body>

</html>
