<div id="confirmModal" class="confirm-modal">

    <div class="confirm-box">

        <div class="confirm-icon">
            <i class="fa-solid fa-trash"></i>
        </div>

        <h2 id="confirmTitle">
            Delete Transaction
        </h2>

        <p id="confirmMessage">
            Are you sure you want to continue?
        </p>

        <div class="confirm-buttons">

            <button
                id="confirmCancel"
                class="secondary-btn">

                Cancel

            </button>

            <button
                id="confirmOk"
                class="danger-btn">

                Delete

            </button>

        </div>

    </div>

</div>
