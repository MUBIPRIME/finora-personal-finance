<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | Finora</title>
    <link rel="shortcut icon" href="../assets/favicon.png.png" type="image/x-icon">

    <link rel="stylesheet"
        href="../css/global.css">

    <link rel="stylesheet"
        href="../css/login.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="login-page">

        <div class="login-left">

            <div class="overlay">

                <h1>Welcome Back</h1>

                <p>

                    Sign in to continue managing your finances.

                </p>

            </div>

        </div>

        <div class="login-right">

            <div class="login-card">

                <h2>Sign In</h2>

                <p>

                    Access your Finora account.

                </p>

                <form id="loginForm">

                    <input
                        type="email"
                        id="email"
                        class="input"
                        placeholder="Email Address"
                        required>

                    <div class="password-group">

                        <input
                            type="password"
                            id="password"
                            class="input"
                            placeholder="Password"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                    <div class="login-options">

                        <label>

                            <input
                                type="checkbox"
                                id="rememberMe">

                            Remember Me

                        </label>

                        <a
                            href="#"
                            id="forgotPassword">

                            Forgot Password?

                        </a>

                    </div>

                    <button
                        type="submit"
                        id="loginBtn"
                        class="btn btn-primary">

                        Sign In

                    </button>

                </form>

                <p class="login-text">

                    Don't have an account?

                    <a href="register.html">

                        Create One

                    </a>

                </p>

            </div>

        </div>

    </div>

    <div id="toast" class="toast">
        <div class="toast-icon">
            <i id="toastIcon" class="fa-solid fa-circle-check"></i>
        </div>
        <div class="toast-content">
            <h4 id="toastTitle">Success</h4>
            <p id="toastMessage">Your action was completed successfully.</p>
        </div>
        <button id="toastClose" class="toast-close">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div id="toastProgress" class="toast-progress"></div>
    </div>

    <script
        type="module"
        src="../js/login.js">
    </script>

</body>

</html>
